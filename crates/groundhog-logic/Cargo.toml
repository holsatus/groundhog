[package]
name = "groundhog-logic"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
futures.workspace = true
mav-param.workspace = true
mavio.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }

rust-ini = "0.21.3"
async-trait = "0.1.89"
tokio-util = { version = "0.7.18", features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
# TCP keepalive tuning on connected transports: silent TCP death is otherwise
# undetectable on the reader half of a link. `all` unlocks TCP_KEEPCNT
# (`with_retries`).
socket2 = { version = "0.6.5", features = ["all"] }
serialport = "4.9.0"
serial2-tokio = { version = "0.1.22", features = ["unix"] }
nalgebra = "0.34.2"
thiserror = "2.0.18"

[dev-dependencies]
# Paused time, so tests of timeouts run instantly.
tokio = { workspace = true, features = ["test-util"] }

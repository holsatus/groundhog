[package]
name = "groundhog"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
env_logger = "0.11.10"
rust-ini = "0.21.3"
# Intentionally not rev-pinned: the `slippery` path dependency also depends on
# iced via this same bare git URL, and adding a `rev` here would split iced into
# two sources (incompatible types). The exact revision is fixed by the committed
# Cargo.lock; fully rev-pinning iced requires aligning slippery's iced
# dependency first.
iced = { git = "https://github.com/iced-rs/iced", features = ["tokio", "advanced", "canvas", "image"] }
# For `task::blocking`, which is not re-exported by `iced`; kept on the same source as `iced`.
iced_runtime = { git = "https://github.com/iced-rs/iced" }
# Direct dependency for the `mav` middleware, which must not depend on the GUI
# framework. Mirrors iced's own feature set so it stays the same crate/version.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

mav-param = { git = "https://github.com/holsatus/mav-param", rev = "04034d9a0c3a8115bd1a9ac2779685184c954ee6" }
mavio = { git = "https://gitlab.com/peterkrull/mavio", rev = "0ad2f7d769fbdeffd88cce9ed45fe3402c991578", features = ["dlct-common", "tokio"] }
async-trait = "0.1.89"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7.18"
# TCP keepalive tuning on connected transports: silent TCP death is otherwise
# undetectable on the reader half of a link. `all` unlocks TCP_KEEPCNT
# (`with_retries`).
socket2 = { version = "0.6.5", features = ["all"] }
serialport = "4.9.0"
serial2-tokio = { version = "0.1.22", features = ["unix"] }
slippery = { git = "https://github.com/peterkrull/slippery" }
rfd = "0.17.2"
directories = "6.0.0"
serde = "1.0.228"
ron = "0.12.1"
nalgebra = "0.34.2"
num_enum = "0.7.6"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

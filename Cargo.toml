[workspace]
resolver = "3"
members = ["crates/groundhog-logic", "crates/groundhog-video", "crates/groundhog-gui-iced"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Arithmetic that wraps in release would silently produce a wrong mission
# item, timeline or link id; the checks cost nothing measurable in a process
# that spends its time waiting on sockets and the GPU.
[profile.release]
overflow-checks = true

# Only dependencies used by more than one crate live here, so the crates that
# share one always agree on its version and source. A dependency of a single
# crate is declared in that crate's manifest.
[workspace.dependencies]
log = "0.4.29"
# Mirrors iced's own feature set so it stays the same crate and version.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
mav-param = { git = "https://github.com/holsatus/mav-param", rev = "04034d9a0c3a8115bd1a9ac2779685184c954ee6" }
mavio = { git = "https://gitlab.com/peterkrull/mavio", rev = "0ad2f7d769fbdeffd88cce9ed45fe3402c991578", features = ["dlct-ardupilotmega", "tokio"] }
tokio = "1.51.1"
serde = "1.0.228"

# The iced fork carries the Android shell support (an `android_main`
# entry point, surface recreation on resume, system fonts and an `arboard`
# that compiles). The workspace root is the only place Cargo reads `[patch]`,
# so every iced crate a dependency asks for directly is redirected here:
# `iced` alone is not enough, because `slippery` also depends on `iced_core`
# and `iced_graphics`, and the frontend on `iced_runtime`. Without these
# entries Cargo would build two copies of iced with incompatible types.
#
# The fork is the `groundhog-compat` branch of github.com/peterkrull/iced:
# iced master plus the six `iced-mobile/iced` commits and one documentation
# fix. See docs/android-port.md.
[patch."https://github.com/iced-rs/iced"]
iced = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_core = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_debug = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_futures = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_graphics = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_program = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_renderer = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_runtime = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_test = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_tiny_skia = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_widget = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_winit = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }
iced_wgpu = { git = "https://github.com/peterkrull/iced", branch = "groundhog-compat" }

[workspace.lints.rust]
unsafe_code = "deny"
let_underscore_drop = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
string_slice = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
exit = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
